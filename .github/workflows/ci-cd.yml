name: DevGate CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  # No Gradle wrapper is committed; AGP 9.1 needs Gradle 9.3.1+.
  GRADLE_VERSION: '9.3.1'
  GRADLE_OPTS: '-Xmx4g -Dorg.gradle.daemon=false'

jobs:
  # --- Lint & Static Analysis ---
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run Lint
        run: gradle lint --no-daemon --stacktrace

  # --- Unit Tests ---
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

  # --- Build Debug APK ---
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # app/build.gradle.kts signs debug builds with the gitignored debug.keystore.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: devgate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # --- Security Scan ---
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # --- License Compliance Check ---
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for LICENSE file
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "::error::No LICENSE file found in repository root"
            exit 1
          fi
          echo "LICENSE file present"

      - name: Check for hardcoded secrets
        run: |
          if grep -r "AIzaSy" --include="*.kt" --include="*.xml" --include="*.json" . 2>/dev/null; then
            echo "::error::Potential hardcoded API key detected"
            exit 1
          fi
          echo "No hardcoded secrets detected"